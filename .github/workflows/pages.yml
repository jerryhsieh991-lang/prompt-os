# Deploys to GitHub Pages. Gated on Validate passing for the same commit.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NOT cancel-in-progress: aborting an in-flight deploy can leave Pages in an
  # inconsistent state. Queue instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build static site (stdlib only)
        run: python3 build_site.py
        env:
          PROMPT_OS_BASE_URL: https://jerryhsieh991-lang.github.io/prompt-os/

      - name: Python/JS analysis-engine parity
        run: node tools/check_js.mjs

      - name: Loop index is in sync with the corpus
        run: python3 tools/regen_index.py --check

      - name: Generator self-checks
        run: python3 test_build.py
        env:
          PROMPT_OS_BASE_URL: https://jerryhsieh991-lang.github.io/prompt-os/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
