# Runs on every branch and PR. Holds NO write permissions and never deploys.
# Previously the only workflow triggered on `main` alone, so work on any other
# branch (including codex/prompt-os) ran zero checks until it was merged.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build static site (stdlib only)
        run: python3 build_site.py

      - name: Client bundle syntax
        run: node --check assets/app.js

      - name: Python/JS analysis-engine parity
        run: node tools/check_js.mjs

      - name: Loop index is in sync with the corpus
        run: python3 tools/regen_index.py --check

      - name: Generator self-checks
        run: python3 test_build.py
